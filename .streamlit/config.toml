# Theme for the Streamlit app (`uv run streamlit run streamlit_app.py`).
#
# Derived from the skill's `financial-dashboard` template, with one deliberate
# change: that template — like all twelve bundled ones — ships a single
# `[theme]` block, and a custom theme with only `[theme]` **locks the app to one
# mode**. The mode switch in the settings menu appears only when both
# `[theme.light]` and `[theme.dark]` are defined. Locking a tool a licensed
# agent uses at a desk and in a client's driveway to permanent dark is a
# regression the template does not intend, so the light half is authored here
# from the same slate/blue family.
#
# Colour is per-mode; everything else is shared, with one exception Streamlit
# imposes and one it does not:
#
#   - Heading sizes and weights set in `[theme]` are **not** inherited by the
#     sidebar (Streamlit's own option description says so). `[theme.sidebar]`
#     below therefore restates them rather than relying on the top block.
#   - `headingFont` is deliberately absent: unset, Streamlit uses `theme.font`
#     for headings, so naming Inter twice only bought a second blocking request
#     to fonts.googleapis.com for a subset of the weights already being fetched.
#
# Everything here is native config — no CSS. See `CLAUDE.md` for why the app
# avoids Altair, which is the other half of "style it without fighting ty".

[theme]
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]

# Subtle rounding and visible borders: the page leans on `st.container(border=True)`
# to group the metric row and each chart panel, so the border is load-bearing.
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

# One palette for both modes — a choice, no longer a constraint. Through 1.60
# this key was registered at `[theme]` only, and a per-mode declaration was
# silently *discarded*: "not a valid config option" on stderr, `st.get_option`
# raising, charts falling back to the built-in palette. As of 1.62 it is
# registered in all six theme locations (`[theme]`, `[theme.sidebar]`,
# `[theme.light]`, `[theme.dark]` and both `.sidebar` sub-tables) — measured on
# the installed version: a per-mode palette is read back correctly with nothing
# on stderr, and `st.get_option("theme.light.chartCategoricalColors")` returns
# `None` rather than raising. (Contrast `theme.light.baseFontSize`, which still
# raises — that one really is `[theme]`-only.) So a per-mode palette is
# available; this file keeps one because these eight were chosen to clear 3:1
# on *both* backgrounds, and two palettes to re-tune buys nothing here.
#
# Two constraints on the single palette, both measured rather than eyeballed:
#
#   - Every entry clears 3:1 (WCAG non-text minimum) against *both* #FFFFFF and
#     the dark mode's #0F172A. That is a luminance band of [0.126, 0.300], which
#     rules out the bright 500-weights of the warm and green hues — hence
#     orange-600, amber-700, teal-600 rather than their lighter siblings.
#   - The first three decide the market page's scatter, which colours by
#     property_type and today has exactly three. Ordered blue / orange / teal
#     because that triad survives colour-vision deficiency: simulating Machado
#     et al. (2009) at severity 1.0, its worst pairwise CIELAB distance is 63
#     under deuteranopia and 56 under protanopia. For comparison, a
#     blue/green/violet ordering measures **1.7** under deuteranopia — visually
#     one colour — which is what this file used to specify before the placement
#     bug above was found. Re-measure before reordering these.
chartCategoricalColors = [
    "#3B82F6",
    "#EA580C",
    "#0D9488",
    "#DB2777",
    "#8B5CF6",
    "#B45309",
    "#64748B",
    "#059669",
]

# Restated because the top block does not reach the sidebar. Deliberately a
# smaller scale than the main column: the only heading the sidebar draws is
# `st.subheader`, and it labels a control group rather than a section of content.
[theme.sidebar]
headingFontSizes = ["20px", "17px", "15px", "14px", "13px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]

# --- light --------------------------------------------------------------------

[theme.light]
primaryColor = "#2563EB"             # Blue 600 — 5.2:1 against the white button text
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9" # Slate 100
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"                # Slate 900
codeTextColor = "#334155"            # Slate 700
linkColor = "#2563EB"
# Borders sit at 1.48:1, under the 3:1 non-text guideline, by decision: they
# group content (`st.container(border=True)` round the metric row and chart
# panels) and inputs carry labels besides. Slate 500 would clear 3:1 and make
# every container heavy. The contrast test skips this key on purpose.
borderColor = "#CBD5E1"              # Slate 300

# Semantic colours. `st.metric` draws its delta arrow in green/red, and the
# market page reads asking-vs-achieved as exactly that signal — these need to
# carry meaning at a glance, not merely pass contrast. Unlike the chart palette
# these *are* per-mode, so each side is tuned to its own background. The target
# is 4.5:1 because `:green[…]`-style markdown draws them as text, raw. The
# metric delta does not: on 1.66 it is a badge, this colour at 10% behind text
# Streamlit darkens itself (measured in the browser: rgb(1, 45, 32) on light),
# so it was legible on the 600s too. Nothing here uses coloured markdown today;
# the target keeps the first use honest. The
# rule: light takes the 600 or 700 shade, whichever clears 4.5:1 on white; dark
# takes the 400 shade. Green, orange and yellow need the 700. They are not the
# chart palette — `chartCategoricalColors` above keeps its own 600s, which only
# need 3:1 as fills.
greenColor = "#047857"               # Emerald 700 — 5.5:1 (600 was 3.8)
redColor = "#DC2626"
yellowColor = "#A16207"              # Yellow 700 — 4.9:1 (600 was 2.9)
orangeColor = "#C2410C"              # Orange 700 — 5.2:1 (600 was 3.6)
blueColor = "#2563EB"
violetColor = "#7C3AED"
grayColor = "#475569"

dataframeBorderColor = "#CBD5E1"
dataframeHeaderBackgroundColor = "#F1F5F9"

[theme.light.sidebar]
backgroundColor = "#F8FAFC"          # Slate 50 — a shade off the main column
secondaryBackgroundColor = "#F1F5F9"
codeBackgroundColor = "#E2E8F0"
textColor = "#0F172A"
borderColor = "#CBD5E1"
primaryColor = "#2563EB"
dataframeHeaderBackgroundColor = "#E2E8F0"
dataframeBorderColor = "#CBD5E1"

# --- dark ---------------------------------------------------------------------

[theme.dark]
# The same Blue 600 as light, not a lifted 400: Streamlit draws primary-button
# text in white in both modes, and white on Blue 400 is 2.5:1. Blue 600 gives
# 5.2:1 for the label and 3.5:1 against the slate background. `linkColor` stays
# at 400, because it is drawn as text on the background, not behind white.
primaryColor = "#2563EB"             # Blue 600
backgroundColor = "#0F172A"          # Slate 900
secondaryBackgroundColor = "#1E293B" # Slate 800
codeBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
codeTextColor = "#CBD5E1"
linkColor = "#60A5FA"                # Blue 400 — 7.0:1 as text on slate 900
borderColor = "#334155"              # Slate 700 — 1.72:1, kept by the same decision as light

greenColor = "#34D399"
redColor = "#F87171"
yellowColor = "#FBBF24"
orangeColor = "#FB923C"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#94A3B8"

dataframeBorderColor = "#334155"
dataframeHeaderBackgroundColor = "#1E293B"

[theme.dark.sidebar]
backgroundColor = "#0B1220"          # A shade under the main column, same as light
secondaryBackgroundColor = "#1E293B"
codeBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
borderColor = "#334155"
primaryColor = "#2563EB"
dataframeHeaderBackgroundColor = "#1E293B"
dataframeBorderColor = "#334155"
