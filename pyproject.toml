[project]
name = "real-estate-agent"
version = "0.1.0"
description = "Real estate agent on Deep Agents"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents>=0.7.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "streamlit>=1.60.0",
]

[tool.uv]
# langgraph-checkpoint-sqlite requires sqlite-vec, and sqlite-vec ships wheels
# only -- no sdist, and none for musllinux or armv7. That turns `uv sync
# --locked` (the documented install and the CI step) into a hard failure on
# Alpine and on 32-bit ARM, for a package the checkpointer never touches:
# `grep -rn sqlite_vec` across langgraph/checkpoint/sqlite/ returns nothing,
# and the sync saver imports stdlib sqlite3 only. An impossible marker drops
# it. If a future release genuinely imports it, the thread tests fail on the
# import rather than at some later runtime -- which is the point of overriding
# rather than filtering the lock by hand.
override-dependencies = ["sqlite-vec; sys_platform == 'never'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/real_estate_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# main.py lives at the repo root; without this the CLI's approval-gate helpers
# are not importable and would go untested.
pythonpath = ["."]

[tool.ruff]
# Makes the pinned invocation enforceable rather than merely documented. Without
# this, `uvx ruff check .` with no version resolves whatever is newest, applies a
# different rule set, and still prints "All checks passed!" -- so "ruff clean"
# would quietly mean something other than what CLAUDE.md claims. There is no
# equivalent for ty: it has no required-version, so its pin stays a convention.
required-version = "==0.16.1"
# Deliberately no target-version. ruff infers py311 from requires-python -- the
# floor the code must support -- exactly as ty infers 3.11 for its own checks.
# Setting target-version = "py314" to "match" .python-version is the tempting
# consistency fix and it is wrong: UP autofixes would then emit 3.12+ syntax
# (UP040's `type` alias, for one) that does not parse on 3.11. The default test
# run is 3.14, so only the explicit 3.11 leg in CLAUDE.md would catch it.

[tool.ruff.lint]
# extend-select, not select. An earlier version of this file replaced the
# defaults outright, reasoning that they widen across releases -- but
# required-version above already fixes exactly which defaults apply, so
# replacing them bought nothing and cost roughly 300 rules this codebase already
# passes: flake8-bugbear, bandit, flake8-datetimez, SIM, RUF, PTH, TRY. Measured:
# a probe with a mutable default argument, a function-scoped import, and a blind
# `except Exception` raises 1 error under the old select and 4 under the
# defaults. Losing B006, BLE001 and DTZ005 for free was not a good trade.
extend-select = ["I", "UP", "PLR0402"]

[tool.ty.terminal]
# Warnings fail the check. Adopted while the codebase was at zero of them, which
# is the only cheap moment to do it -- later it means clearing a backlog first.
# Note what is deliberately absent: no [tool.ty.environment] python-version. ty
# infers 3.11 from requires-python, which is the floor the code must support,
# not the 3.14 in .python-version that merely runs it. Pinning the environment
# to 3.14 would stop ty catching syntax that breaks the users we claim to serve.
error-on-warning = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
