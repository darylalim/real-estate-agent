[project]
name = "real-estate-agent"
version = "0.1.0"
description = "Real estate agent on Deep Agents"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents>=0.7.1",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/real_estate_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# main.py lives at the repo root; without this the CLI's approval-gate helpers
# are not importable and would go untested.
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
